name: Build bergamot and dependencies library for linux

on:
  push:
    paths:
      - '.github/workflows/build-dependencies.yml'
      - 'scripts/simple-build-dependencies.sh'
      - 'patch/translations.patch'
  pull_request:
    paths:
      - '.github/workflows/build-dependencies.yml'
      - 'scripts/simple-build-dependencies.sh'
      - 'patch/translations.patch'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libpng-dev libtiff-dev libjpeg-dev libwebp-dev libgif-dev libopenjp2-7-dev libgtk-3-dev meson make automake autoconf perl lzip libtool zlib1g-dev \
            libsecret-1-dev libnotify-dev

      - name: Run build script
        run: |
          cd scripts 
          chmod +x simple-build-dependencies.sh
          ./simple-build-dependencies.sh

      - name: Prepare artifact structure
        run: |
          mkdir -p artifact_stage/build
          cp -r build/linux artifact_stage/build/

      - name: Get current date
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-linux-${{ hashFiles('scripts/simple-build-dependencies.sh', 'patch/translations.patch' , '.github/workflows/built-translator.yml') }}
          path: |
            artifact_stage/
          if-no-files-found: error
