      msgfmt hr/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/hr/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/sl/LC_MESSAGES 
      msgfmt sl/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/sl/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/lt/LC_MESSAGES 
