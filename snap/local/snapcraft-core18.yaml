      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/lv/LC_MESSAGES 
      msgfmt lv/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/lv/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/et/LC_MESSAGES
      msgfmt et/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/et/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/is/LC_MESSAGES 
