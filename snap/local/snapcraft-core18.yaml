name: opolyglot        # Виправлено: малі літери 
title: OPolyglot offline translator
base: core18
version: 'core18.proxima.centauri.1'         # Виправлено: додано 0 перед крапкою 
license: Apache-2.0
summary: Your Private Offline Translator 
adopt-info: description-setter
grade: stable 
confinement: strict

architectures:
  - build-on: [amd64]
    run-on: [amd64]

package-repositories:
  - type: apt
    formats: [deb]
    components: [main]
    suites: [bionic] # або jammy, якщо core22
    key-id: C8EC952E2A0E1FBDC5090F6A2C277A0A352154E5
    url: https://ppa.launchpadcontent.net/ubuntu-toolchain-r/test/ubuntu
#key-server: https://keyserver.ubuntu.com/pks/lookup?fingerprint=on&op=index&search=0xC8EC952E2A0E1FBDC5090F6A2C277A0A352154E5
#2C277A0A352154E5


#run in host shell
#multipass set local.snapcraft-opolyglot.memory=4G
#run in guest shell 
#sudo gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C8EC952E2A0E1FBDC5090F6A2C277A0A352154E5
#sudo gpg --export --armor C8EC952E2A0E1FBDC5090F6A2C277A0A352154E5 | sudo apt-key add -
#snap install cmake --classic

environment:
  LD_LIBRARY_PATH: $SNAP/usr/local/lib/x86_64-linux-gnu/:$SNAP/usr/lib:$SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu/openblas-pthread:$LD_LIBRARY_PATH

apps:
  opolyglot:           # Виправлено: малі літери
    command: opolyglot
    common-id: io.sourceforge.opolyglot 
    environment:
      LOCPATH: $SNAP/usr/lib/locale
    extensions: [gnome-3-34]
    plugs:             # Виправлено: правильні відступи
      - desktop
      - desktop-legacy
      - network
      - x11
      - wayland
      - home

parts:
  description-setter:
    plugin: nil
    override-pull: |
      craftctl set description="$(cat doc/DESCRIPTION.md)"
  bergamot-lib:
    plugin: nil
    source: https://github.com/mozilla/translations/
    source-commit: c458f2fcb6dd6f890d92ff8272b548a35d1e5c64
    source-type: git
#parse-info: [patch/SnapTranslations.patch]
    build-packages:
      - gcc-13
      - g++-13
      - make
      - libpcre2-dev
      - libopenblas-dev
    stage-packages:
      - libpcre2-posix0
      - libopenblas-base
    override-pull: |
      snapcraftctl pull 
      echo "---------------------------------------------"
      echo "---------------------------------------------"
      echo "---------------------------------------------"
      patch -p1 < $SNAPCRAFT_PROJECT_DIR/patch/SnapTranslations.patch    
    override-build: |
      export CC=gcc-13
      export CXX=g++-13
      snap run cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ./ 
      make -j$(nproc)
      mkdir -p $SNAPCRAFT_PART_INSTALL/bergamot
      cp -r ./inference/ $SNAPCRAFT_PART_INSTALL/bergamot
      echo "----------------------------------------------------------------"
      echo "$SNAPCRAFT_PART_INSTALL"
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/lib/
      cp libmarian.so $SNAPCRAFT_PART_INSTALL/usr/lib/
      cp inference/src/translator/libbergamot-translator-source.so $SNAPCRAFT_PART_INSTALL/usr/lib/
  wxgtk-lib:
    plugin: autotools
    source: https://github.com/wxWidgets/wxWidgets/releases/download/v3.2.10/wxWidgets-3.2.10.tar.bz2
    source-type: tar
    configflags: ['--prefix=/usr','--with-gtk=3', '--with-cxx=17', '--with-libiconv']
    build-packages:
      - libtool
      - autoconf
      - automake
      - pkg-config
      - g++-13
      - gcc-13
      - libpng-dev
      - libcurl4-openssl-dev
      - zlib1g-dev
    stage-packages:
      - zlib1g
      - libcurl4
      - libpng16-16
      - libpcre2-32-0
    override-build: |
      export CC=gcc-13
      export CXX=g++-13
      snapcraftctl build
    stage:
      - "*"
    prime:
      - usr/*
      - -usr/bin/*
      - -usr/lib/libwx_gtk3u_adv-3.2.so
      - -usr/lib/libwx_gtk3u_adv-3.2.so.0
      - -usr/lib/libwx_gtk3u_adv-3.2.so.0.4.3
      - -usr/lib/libwx_gtk3u_aui-3.2.so
      - -usr/lib/libwx_gtk3u_aui-3.2.so.0
      - -usr/lib/libwx_gtk3u_aui-3.2.so.0.4.3
      - -usr/lib/libwx_gtk3u_html-3.2.so
      - -usr/lib/libwx_gtk3u_html-3.2.so.0
      - -usr/lib/libwx_gtk3u_html-3.2.so.0.4.3
      - -usr/lib/libwx_gtk3u_propgrid-3.2.so
      - -usr/lib/libwx_gtk3u_propgrid-3.2.so.0
      - -usr/lib/libwx_gtk3u_propgrid-3.2.so.0.4.3
      - -usr/lib/libwx_gtk3u_qa-3.2.so
      - -usr/lib/libwx_gtk3u_qa-3.2.so.0
      - -usr/lib/libwx_gtk3u_qa-3.2.so.0.4.3
      - -usr/lib/libwx_gtk3u_ribbon-3.2.so
      - -usr/lib/libwx_gtk3u_ribbon-3.2.so.0
      - -usr/lib/libwx_gtk3u_ribbon-3.2.so.0.4.3
      - -usr/lib/libwx_gtk3u_richtext-3.2.so
      - -usr/lib/libwx_gtk3u_richtext-3.2.so.0
      - -usr/lib/libwx_gtk3u_richtext-3.2.so.0.4.3
      - -usr/lib/libwx_gtk3u_webview-3.2.so
      - -usr/lib/libwx_gtk3u_webview-3.2.so.0
      - -usr/lib/libwx_gtk3u_webview-3.2.so.0.4.3
      - -usr/lib/libwx_gtk3u_xrc-3.2.so
      - -usr/lib/libwx_gtk3u_xrc-3.2.so.0
      - -usr/lib/libwx_gtk3u_xrc-3.2.so.0.4.3
  libportal:
    plugin: meson
    source: https://github.com/flatpak/libportal
    source-commit: 13df0b887a7eb7b0f9b14069561a41f62e813155
    source-type: git
    meson-parameters:
      - -Dbackends=gtk3
      - -Dvapi=false
      - -Ddocs=false
      - -Dtests=false
  opolyglot-app:       # Виправлено: назва в нижньому регістрі
    plugin: nil
    source: .
    source-type: local
#source-subdir: ../
    after: [bergamot-lib,wxgtk-lib,libportal]
    build-packages:
      - gcc-13
      - g++-13
      - make
      - libtomcrypt-dev
      - libtesseract-dev
    stage-packages:
      - libtomcrypt1
      - libtesseract4
      - libstdc++6
      - locales
    override-build: |  # Виправлено: тепер це частина секції parts 
      export CC=gcc-13
      export CXX=g++-13
      make -f Makefile clean
      make SNAP=1 -f Makefile build
      echo "start build libtranslator"
      echo "finish libtranslator"
      cp bin/opolyglot $SNAPCRAFT_PART_INSTALL/
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/opolyglot/
      cp res/download.xml   $SNAPCRAFT_PART_INSTALL/usr/share/opolyglot
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/lib/
    override-prime: |
      snapcraftctl prime 
      rm -rf $SNAPCRAFT_PRIME/bergamot
      rm -rf $SNAPCRAFT_PRIME/usr/include
      rm -rf $SNAPCRAFT_PRIME/usr/local/include
      rm -rf $SNAPCRAFT_PRIME/usr/lib/wx/include
  locales:
    plugin: nil
    source: src/locale
    build-packages: [gettext]
    override-build: |
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/cs/LC_MESSAGES 
      msgfmt cs/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/cs/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/en/LC_MESSAGES
      msgfmt en/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/en/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/es/LC_MESSAGES 
      msgfmt es/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/es/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/fr/LC_MESSAGES 
      msgfmt fr/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/fr/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/uk/LC_MESSAGES 
      msgfmt uk/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/uk/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/de/LC_MESSAGES 
      msgfmt de/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/de/LC_MESSAGES/opolyglot.mo
