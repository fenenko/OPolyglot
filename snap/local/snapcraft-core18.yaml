      msgfmt tr/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/tr/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/pt/LC_MESSAGES 
