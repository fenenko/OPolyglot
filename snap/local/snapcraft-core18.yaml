      msgfmt az/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/az/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/sq/LC_MESSAGES 
