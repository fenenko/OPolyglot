      msgfmt it/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/it/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/pl/LC_MESSAGES 
      msgfmt pl/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/pl/LC_MESSAGES/opolyglot.mo
