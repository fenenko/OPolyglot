      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/fi/LC_MESSAGES 
      msgfmt fi/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/fi/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/sv/LC_MESSAGES 
      msgfmt sv/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/sv/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/no/LC_MESSAGES 
      msgfmt no/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/no/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/bg/LC_MESSAGES 
      msgfmt bg/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/bg/LC_MESSAGES/opolyglot.mo
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/locale/el/LC_MESSAGES 
      msgfmt el/opolyglot.po -o $SNAPCRAFT_PART_INSTALL/usr/share/locale/el/LC_MESSAGES/opolyglot.mo
