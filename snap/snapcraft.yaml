name: opolyglot        
title: OPolyglot offline translator
base: core24
#version: 'proxima.centauri.1'          
license: Apache-2.0
summary: Your Private Offline Translator 
description: |
  **OPolyglot** is a fast and fully offline translator that respects your privacy. The application is powered by the robust **Bergamot** engine, allowing you to perform all translations locally on your device without the need for an internet connection.
  At the current stage of development, OPolyglot offers two key features:
  * Implemented language downloading via libcurl.
  * **Simple Translator:** A convenient tool for classic translation of typed or copied text.
  * **Screen Translator:** A smart feature that allows you to take a screenshot of any screen area, automatically recognize the text (OCR), and instantly translate it.
  OPolyglot is an excellent assistant for reading foreign documents, playing games, or working with unlocalized applications, all while keeping your data completely secure.
grade: stable 
confinement: strict
website:
  - https://opolyglot.sourceforge.io
issues:
  - https://github.com/fenenko/OPolyglot/issues 
source-code:
  - https://github.com/fenenko/OPolyglot
adopt-info: opolyglot-app

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

environment:
  LD_LIBRARY_PATH: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/openblas-pthread:$LD_LIBRARY_PATH

apps:
  opolyglot:           
    command: opolyglot
    common-id: io.sourceforge.opolyglot 
    environment:
      LOCPATH: $SNAP/usr/lib/locale
    extensions: [gnome]
    plugs:             
      - desktop
      - home
      - network
      - x11
      - wayland

parts:
  bergamot-lib:
    plugin: nil
    source: https://github.com/mozilla/translations/
    source-commit: c458f2fcb6dd6f890d92ff8272b548a35d1e5c64
    source-type: git
    build-packages:
      - git
      - cmake
      - gcc
      - g++
      - make
      - libpcre2-dev
      - libopenblas-dev
      - wget
    stage-packages:
      - libpcre2-8-0:$CRAFT_ARCH_BUILD_FOR
      - libopenblas0:$CRAFT_ARCH_BUILD_FOR
    override-pull: |
      craftctl default
      echo "---------------------------------------------"
      echo "---------------------------------------------"
      echo "---------------------------------------------"
      echo "$CRAFT_ARCH_TRIPLET_BUILD_FOR"
      wget https://github.com/fenenko/OPolyglot/raw/refs/heads/proxima_centauri/patch/SnapTranslations.patch -O SnapTranslations.patch
      patch -p1 < SnapTranslations.patch    
    override-build: |
      cmake ./
      make -j$(nproc)
      mkdir -p $CRAFT_PART_INSTALL/bergamot
      cp -r ./inference/ $CRAFT_PART_INSTALL/bergamot
      echo "----------------------------------------------------------------"
      echo "$CRAFT_PART_INSTALL"
      mkdir -p $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      cp libmarian.so $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      cp inference/src/translator/libbergamot-translator-source.so $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
  opolyglot-app:       
    plugin: nil
    source: https://github.com/fenenko/OPolyglot
    source-type: git
    after: [bergamot-lib]
    build-packages:
      - git
      - gcc
      - g++
      - make
      - libgtk-3-dev
      - libtomcrypt-dev
      - libwxgtk3.2-dev
      - libtesseract-dev
      - libportal-dev
      - libpango1.0-dev
      - libportal-gtk3-dev
      - libcurl4-openssl-dev
    stage-packages:
      - libtomcrypt1
      - libwxgtk3.2-1t64:$CRAFT_ARCH_BUILD_FOR
      - libwxbase3.2-1t64:$CRAFT_ARCH_BUILD_FOR
      - libtesseract5:$CRAFT_ARCH_BUILD_FOR
      - libportal1:$CRAFT_ARCH_BUILD_FOR
      - libportal-gtk3-1:$CRAFT_ARCH_BUILD_FOR
      - libcurl4t64
      - locales
    override-pull: |
      craftctl default
      GIT_VERSION=$(git describe --tags --always)
      craftctl set version="$GIT_VERSION"
    override-build: |  
      make clean
      make SNAP=1 build
      cp bin/opolyglot $SNAPCRAFT_PART_INSTALL/
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/share/opolyglot/
      cp res/download.xml   $SNAPCRAFT_PART_INSTALL/usr/share/opolyglot
      cp res/cacert.pem   $SNAPCRAFT_PART_INSTALL/usr/share/opolyglot
    override-prime: |
      craftctl default
      rm -rf $CRAFT_PRIME/bergamot
  locales:
    plugin: nil
    source: https://github.com/fenenko/OPolyglot
    source-type: git
    build-packages: [gettext,git]
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/share/locale/cs/LC_MESSAGES 
      msgfmt src/locale/cs/opolyglot.po -o $CRAFT_PART_INSTALL/usr/share/locale/cs/LC_MESSAGES/opolyglot.mo
      mkdir -p $CRAFT_PART_INSTALL/usr/share/locale/en/LC_MESSAGES
      msgfmt src/locale/en/opolyglot.po -o $CRAFT_PART_INSTALL/usr/share/locale/en/LC_MESSAGES/opolyglot.mo
