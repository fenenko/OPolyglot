name: opolyglot        # Виправлено: малі літери 
title: OPolyglot offline translator
base: core24
version: 'proxima.centauri.1'         # Виправлено: додано 0 перед крапкою 
license: Apache-2.0
summary: offline translator
description: OPolyglot
grade: devel
confinement: strict
environment:
  LD_LIBRARY_PATH: $SNAP/usr/lib/x86_64-linux-gnu:$SNAP/usr/lib/x86_64-linux-gnu/openblas-pthread:$LD_LIBRARY_PATH

apps:
  opolyglot:           # Виправлено: малі літери
    command: opolyglot
    common-id: io.sourceforge.opolyglot 
    environment:
      LOCPATH: $SNAP/usr/lib/locale
    extensions: [gnome]
    plugs:             # Виправлено: правильні відступи
      - home
      - network
      - x11
      - wayland

parts:
  bergamot-lib:
    plugin: nil
    source: https://github.com/mozilla/translations/
    source-commit: c458f2fcb6dd6f890d92ff8272b548a35d1e5c64
    source-type: git
    parse-info: [scripts/SnapTranslations.patch]
    build-packages:
      - cmake
      - gcc
      - g++
      - make
      - libpcre2-dev
      - libopenblas-dev
    stage-packages:
      - libpcre2-8-0
      - libopenblas0
    override-pull: |
      craftctl default
      patch -p1 < $CRAFT_PROJECT_DIR/scripts/SnapTranslations.patch    
    override-build: |
      cmake ./
      make -j4
      mkdir -p $CRAFT_PART_INSTALL/bergamot
      cp -r ./inference/ $CRAFT_PART_INSTALL/bergamot
      echo "----------------------------------------------------------------"
      echo "$CRAFT_PART_INSTALL"
      mkdir -p $CRAFT_PART_INSTALL/usr/lib/x86_64-linux-gnu
      cp libmarian.so $CRAFT_PART_INSTALL/usr/lib/x86_64-linux-gnu
      cp inference/src/translator/libbergamot-translator-source.so $CRAFT_PART_INSTALL/usr/lib/x86_64-linux-gnu
#prime:
#      - -bergamot/*
  opolyglot-app:       # Виправлено: назва в нижньому регістрі
    plugin: nil
    source: .
    after: [bergamot-lib]
    build-packages:
      - gcc
      - g++
      - make
      - libtomcrypt-dev
      - libwxgtk3.2-dev
      - libtesseract-dev
    stage-packages:
      - libtomcrypt1
      - libwxgtk3.2-1t64
      - libwxbase3.2-1t64
      - libtesseract5
      - locales
    override-build: |  # Виправлено: тепер це частина секції parts 
      make clean
      make SNAP=1 build
      make SNAP=1 libtranslator
      rm -rf $SNAPCRAFT_PART_INSTALL/bergamot
      cp bin/opolyglot $SNAPCRAFT_PART_INSTALL/
      cp -r bin/locale  $SNAPCRAFT_PART_INSTALL/
      cp -r bin/res   $SNAPCRAFT_PART_INSTALL/
      mkdir -p $SNAPCRAFT_PART_INSTALL/usr/lib/x86_64-linux-gnu
      cp bin/libopolyglot-ocr-translator.so $SNAPCRAFT_PART_INSTALL/usr/lib/x86_64-linux-gnu
    override-prime: |
      craftctl default
      rm -rf $CRAFT_PRIME/bergamot
  locales:
    plugin: nil
    source: src/locale
    build-packages: [gettext]
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/share/locale/cs/LC_MESSAGES 
      msgfmt cs/opolyglot.po -o $CRAFT_PART_INSTALL/usr/share/locale/cs/LC_MESSAGES/opolyglot.mo
      mkdir -p $CRAFT_PART_INSTALL/usr/share/locale/en/LC_MESSAGES
      msgfmt en/opolyglot.po -o $CRAFT_PART_INSTALL/usr/share/locale/en/LC_MESSAGES/opolyglot.mo
