    override-prime: |
      craftctl default
      rm -rf $CRAFT_PRIME/bergamot
  license:
    plugin: dump
    source: ./doc
    organize:
      LICENSES.snap.txt: LICENSES.txt
    stage:
      - LICENSES.txt
    prime:
      - LICENSES.txt

